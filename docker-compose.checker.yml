name: hse-ai-ecosystem-checker

networks:
  hse_ai_ecosystem:
    external: true
  infra_monitoring_net:
    external: true

services:
  autochecker:
    build:
      context: ./ai-autochecker
      dockerfile: Dockerfile
    container_name: hse-autocheck-backend
    restart: always
    ports:
      - "8099:8000"
    env_file:
      - ./ai-autochecker/.env
    networks:
      - hse_ai_ecosystem
      - infra_monitoring_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  personalquiz:
    build:
      context: ./personalquiz
      dockerfile: Dockerfile
    container_name: hse-personalquiz-backend
    restart: always
    ports:
      - "8100:8000"
    env_file:
      - ./personalquiz/.env
    networks:
      - hse_ai_ecosystem
      - infra_monitoring_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3