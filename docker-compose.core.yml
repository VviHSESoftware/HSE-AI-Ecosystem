name: hse-ai-ecosystem-core

networks:
  hse_ai_ecosystem:
    external: true
  infra_monitoring_net:
    external: true

services:
  ai-gateway:
    build:
      context: .
      dockerfile: ai-gateway/Dockerfile
    container_name: hse-ai-gateway
    restart: always
    ports:
      - "8090:8000"
    env_file: ./ai-gateway/.env
    volumes:
      - ./ai-gateway/config.json:/app/config.json:ro
    networks:
      - hse_ai_ecosystem
      - infra_monitoring_net
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535

  ai-router:
    build:
      context: .
      dockerfile: ai-router/Dockerfile
    container_name: hse-ai-router
    restart: always
    ports:
      - "8091:8000"
    env_file: ./ai-router/.env
    networks:
      - hse_ai_ecosystem
      - infra_monitoring_net

  kb-interface:
    build:
      context: .
      dockerfile: kb-interface/Dockerfile
    container_name: hse-kb-interface
    restart: always
    ports:
      - "8096:8000"
    env_file: ./kb-interface/.env
    networks:
      - hse_ai_ecosystem
      - infra_monitoring_net

  kb-mcp:
    build:
      context: .
      dockerfile: kb-mcp/Dockerfile
    container_name: hse-kb-mcp
    restart: always
    ports:
      - "8103:8000"
    env_file: ./kb-mcp/.env
    networks:
      - hse_ai_ecosystem
      - infra_monitoring_net

  kb-controller:
    build:
      context: .
      dockerfile: kb-controller/Dockerfile
    container_name: hse-kb-controller
    restart: always
    ports:
      - "8097:8000"
    env_file: ./kb-controller/.env
    networks:
      - hse_ai_ecosystem
      - infra_monitoring_net

  document-processor:
    build:
      context: .
      dockerfile: doc-processor/Dockerfile
    ports:
      - "8095:8000"
    container_name: hse-document-processor
    restart: always
    env_file: ./doc-processor/.env
    depends_on:
      - ai-gateway
    networks:
      - hse_ai_ecosystem

  task-processor:
    build:
      context: .
      dockerfile: ai-task-processor/Dockerfile
    container_name: hse-task-processor
    restart: always
    ports:
      - "8099:8000"
    env_file:
      - ai-task-processor/.env
    networks:
      - hse_ai_ecosystem
      - infra_monitoring_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3