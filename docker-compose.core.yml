name: hse-ai-ecosystem-core

networks:
  hse_ai_ecosystem:
    external: true
  infra_monitoring_net:
    external: true

services:
  ai-gateway:
    build:
      context: ./ai-gateway
      dockerfile: Dockerfile
    container_name: hse-ai-gateway
    restart: always
    ports:
      - "8090:8000"
    env_file: ./ai-gateway/.env
    volumes:
      - ./ai-gateway/config.json:/app/config.json:ro
    networks:
      - hse_ai_ecosystem
      - infra_monitoring_net
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535

  ai-router:
    build:
      context: ./ai-router
      dockerfile: Dockerfile
    container_name: hse-ai-router
    restart: always
    ports:
      - "8091:8000"
    env_file: ./ai-router/.env
    networks:
      - hse_ai_ecosystem
      - infra_monitoring_net

  kb-interface:
    build:
      context: ./kb-interface
      dockerfile: Dockerfile
    container_name: hse-kb-interface
    restart: always
    ports:
      - "8096:8000"
    env_file: ./kb-interface/.env
    networks:
      - hse_ai_ecosystem
      - infra_monitoring_net

  kb-controller:
    build:
      context: ./kb-controller
      dockerfile: Dockerfile
    container_name: hse-kb-controller
    restart: always
    ports:
      - "8097:8000"
    env_file: ./kb-controller/.env
    networks:
      - hse_ai_ecosystem
      - infra_monitoring_net

  data-extractor:
    build:
      context: ./data-extractor
      dockerfile: Dockerfile
    container_name: hse-data-extractor
    restart: always
    ports:
      - "8098:8000"
    env_file: ./data-extractor/.env
    depends_on:
      - ai-gateway
    networks:
      - hse_ai_ecosystem

  document-processor:
    build:
      context: ./doc-processor
      dockerfile: Dockerfile
    ports:
      - "8095:8000"
    container_name: hse-document-processor
    restart: always
    env_file: ./doc-processor/.env
    depends_on:
      - ai-gateway
    networks:
      - hse_ai_ecosystem