[project]
name = "hse-ai-gateway"
version = "1.0.0"
description = "High-performance AI Gateway for HSE services"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "gunicorn",
    "pydantic>=2.0.0",
    "pydantic-settings",
    "httpx",
    "python-multipart",
    "python-json-logger",
    "python-dotenv",
    "prometheus-fastapi-instrumentator",
    "orjson",
]

[tool.uv]
dev-dependencies = [
    "pytest",
    "httpx",
]