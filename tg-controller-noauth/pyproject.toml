[project]
name = "hse-tg-bot-noauth"
version = "1.0.0"
description = "Telegram Controller for HSE AI Ecosystem without auth"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "gunicorn",
    "aiogram>=3.0.0",
    "redis>=5.0.0",
    "httpx",
    "pydantic>=2.0.0",
    "pydantic-settings",
    "python-json-logger",
    "python-dotenv",
    "prometheus-fastapi-instrumentator",
    "orjson",
    "aiohttp-socks"
]