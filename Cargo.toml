[workspace]
resolver = "2"
members = [
    "ai-autochecker",
    "ai-gateway",
    "ai-mock-provider",
    "ai-router",
    "data-extractor",
    "doc-processor",
    "kb-controller",
    "kb-interface",
    "libs/ai-gateway-client",
    "libs/common-infra",
]

[workspace.dependencies]
# Web & Async
async-trait = "0.1"
axum = { version = "0.8.9", features = ["macros", "multipart"] }
fang = { version = "0.11.0-rc.1", default-features = false, features = ["asynk"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
scraper = "0.19"
tokio = { version = "1.52.1", features = ["full"] }
tower-http = { version = "0.5", features = ["trace"] }
url = "2.5"

# Serialization
bincode = "1.3"
dotenvy = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "json", "macros"] }

# Logging & Metrics
metrics = "0.24.5"
metrics-exporter-prometheus = "0.13"
prometheus = { version = "0.14", features = ["process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# OpenAPI
utoipa = { version = "5.4.0", features = ["axum_extras", "uuid"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }

# Hashing
hex = "0.4"
sha2 = "0.11.0"

# Chunking
text-splitter = { version = "0.16", features = ["markdown"] }

# Common Utils
chrono = "0.4.44"
config = "0.15.22"
lazy_static = "1.4"
regex = "1.10"
tempfile = "3.10"
thiserror = "2.0"
typetag = "0.2"
uuid = { version = "1.8", features = ["v4", "serde"] }

# Internal
ai-gateway-client = { path = "libs/ai-gateway-client", features = ["openapi"] }
doc-processor-client = { path = "libs/doc-processor-client", features = ["openapi"] }
common-infra = { path = "libs/common-infra", features = ["openapi"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"