[project]
name = "hse-alice-controller"
version = "1.0.0"
description = "Yandex Alice Controller for HSE AI Ecosystem"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "gunicorn",
    "redis>=5.0.0",
    "httpx",
    "pydantic>=2.0.0",
    "pydantic-settings",
    "python-json-logger",
    "python-dotenv",
    "prometheus-fastapi-instrumentator",
    "orjson"
]