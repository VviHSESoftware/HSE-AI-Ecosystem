version: '3.8'

services:
  kb-controller:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: hse-kb-controller-debug
    volumes:
      - .:/app
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/app/target
    environment:
      - RUST_LOG=debug
    networks:
      - hse_ai_ecosystem
      - infra_monitoring_net
    ports:
      - "8001:8000"
    restart: unless-stopped

volumes:
  cargo-cache:
  target-cache:

networks:
  hse_ai_ecosystem:
    external: true
  infra_monitoring_net:
    external: true