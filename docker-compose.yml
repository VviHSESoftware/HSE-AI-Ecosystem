version: '3.8'

networks:
  app_net:
    driver: bridge
  infra_monitoring_net:
    external: true

services:
  ai-gateway:
    build:
      context: ./ai-gateway
      dockerfile: Dockerfile
    container_name: hse-ai-gateway
    restart: always
    ports:
      - "8090:8000"
    environment:
      - WEB_CONCURRENCY=2
    env_file:
      - ./ai-gateway/.env
    networks:
      - app_net
      - infra_monitoring_net

  ai-router:
    build:
      context: ./ai-router
      dockerfile: Dockerfile
    container_name: hse-ai-router
    restart: always
    ports:
      - "8091:8000"
    env_file:
      - ./ai-router/.env
    environment:
      - WEB_CONCURRENCY=2
    depends_on:
      - ai-gateway
    networks:
      - app_net
      - infra_monitoring_net

  tg-controller:
    build:
      context: ./tg-controller
      dockerfile: Dockerfile
    container_name: hse-tg-controller
    restart: always
    ports:
      - "8092:8000"
    env_file:
      - ./tg-controller/.env
    environment:
      - WEB_CONCURRENCY=1
    depends_on:
      - redis
      - ai-router
    networks:
      - app_net
      - infra_monitoring_net

  alice-controller:
    build:
      context: ./alice-controller
      dockerfile: Dockerfile
    container_name: hse-alice-controller
    restart: always
    ports:
      - "8093:8000"
    environment:
      - WEB_CONCURRENCY=2
    env_file:
      - ./alice-controller/.env
    depends_on:
      - redis
      - ai-router
    networks:
      - app_net
      - infra_monitoring_net

  redis:
    image: redis:alpine
    container_name: hse-redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - app_net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: hse-qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - app_net

volumes:
  redis_data:
  qdrant_data: