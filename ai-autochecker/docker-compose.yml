version: '3.8'

services:
  autochecker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hse-autocheck-backend
    restart: always
    ports:
      - "8099:8000"
    env_file:
      - .env
    networks:
      - hse_ai_ecosystem
      - infra_monitoring_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  hse_ai_ecosystem:
    external: true
  infra_monitoring_net:
    external: true