[package]
name = "hse-autocheck-rust"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1.52.1", features = ["full"] }
axum = { version = "0.8.9", features = ["macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
regex = "1.10"
uuid = { version = "1.8", features =["v4", "serde"] }
metrics = "0.22"
metrics-exporter-prometheus = "0.13"

sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "json", "macros"] }
fang = { version = "0.11.0-rc.1", default-features = false, features = ["asynk"] }
typetag = "0.2"
async-trait = "0.1"

utoipa = { version = "5.4.0", features =["axum_extras", "uuid"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
thiserror = "1.0.69"
chrono = "0.4.44"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"